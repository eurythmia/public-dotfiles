# ============================================================================
#  tmux — Catppuccin Mocha (hand-rolled, no plugins)
#  Palette: https://github.com/catppuccin/catppuccin
# ============================================================================

# ── Palette (Catppuccin Mocha) ──────────────────────────────────────────────
#  base      #1e1e2e   crust   #11111b   mantle  #181825
#  surface0  #313244   surface1 #45475a  surface2 #585b70
#  text      #cdd6f4   subtext0 #a6adc8  subtext1 #bac2de
#  blue      #89b4fa   lavender #b4befe  sapphire #74c7ec
#  teal      #94e2d5   green   #a6e3a1  yellow  #f9e2af
#  peach     #fab387   red     #f38ba8  mauve   #cba6f7
#  pink      #f5c2e7   maroon  #eba0ac  rosewater #f5e0dc

# ── Prefix ──────────────────────────────────────────────────────────────────
set -g prefix `
unbind C-b
bind-key ` send-prefix
set -sg escape-time 10

# ── Base behaviour ──────────────────────────────────────────────────────────
set -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
setw -g mode-keys vi
set -g mouse on
set -s set-clipboard on

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Windows & panes
bind Space next-window
bind | split-window -h
bind - split-window -v

# Move between panes (vim style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Jump between windows
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode (vi) + OSC 52 clipboard (works over SSH, no X server)
#
# copy-pipe-and-cancel with no command still fills the tmux buffer, and with
# set-clipboard on it also emits OSC 52 — which is what carries the selection
# back to the local clipboard over SSH. That is why the mouse binding uses it.
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Maximize / restore a pane
unbind Up
bind Up new-window -d -n tmp \; swap-pane -s tmp.1 \; select-window -t tmp
unbind Down
bind Down last-window \; swap-pane -s tmp.1 \; kill-window -t tmp

# New/attach session
bind S command-prompt -p "Make/attach session:" "new-window 'tmuxstart \'%%\''"

# ── Appearance (Catppuccin Mocha) ──────────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
set -g status-left-length 30
set -g status-right-length 80
set -g status-interval 5

# Left: session name on a mauve block
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold] #S #[fg=#cdd6f4,bg=#1e1e2e] "

# Window list: current window = blue block (bold), others dim
setw -g window-status-format "#[fg=#a6adc8]#I:#W"
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold]#I:#W"
setw -g window-status-separator " "

# Right: hostname · date · time
set -g status-right "#[fg=#a6adc8]#h · %a %d %b %H:%M "

# Pane borders: active = bright mauve, inactive = dim
setw -g pane-border-style "fg=#313244"
setw -g pane-active-border-style "fg=#cba6f7"

# Message / command line
set -g message-style "fg=#cdd6f4,bg=#313244"

# Copy-mode / selection highlight
set -g mode-style "fg=#11111b,bg=#f9e2af"
